[project]
name = "agentic-claims-poc"
version = "0.9.0"
description = "Multi-agent agentic AI prototype for insurance claims processing."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "sentence-transformers>=3.0",
    # torch is already required transitively by sentence-transformers. It is
    # declared directly so the `[tool.uv.sources]` CPU-index pin below applies
    # (uv honours sources only for the project's own dependencies), and pinned
    # exactly so macOS (PyPI) and Linux (CPU index) resolve the *same* torch:
    # the policy index is embedded on a developer Mac and queried in the Azure
    # container, and the embedding stack is a one-way door (CLAUDE.md).
    "torch==2.11.0",
    "anthropic>=0.40",
    "mistralai>=1.5",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pip-audit>=2.7",
]

# PyTorch's PyPI wheels for Linux declare the CUDA toolkit as dependencies
# (36 `nvidia-*` packages, a 530 MB torch wheel), none of which a CPU-only
# container can use. Resolve torch from the PyTorch CPU index on Linux only,
# so the Azure image and CI stay small; macOS development keeps resolving
# from PyPI unchanged (Phase 9.1).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection marker is designed to be called in argument
# defaults; without this, B008 flags every endpoint. This allow-list does not
# relax B008 for any other call.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["backend"]

# Third-party libraries without bundled type stubs. Restricted to
# packages we use directly; not a blanket ignore.
[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "sentence_transformers",
    "transformers",
    "transformers.*",
    # mistralai 2.x does not ship a `py.typed` marker. Anthropic does.
    "mistralai",
    "mistralai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
